services:
  btccd:
    build:
      context: .
      dockerfile: Dockerfile.btccd
      args:
        BTCCD_REPO: ${BTCCD_REPO:-https://github.com/Marcus-Vane/Bitcoin-Classic.git}
        BTCCD_REF: ${BTCCD_REF:-main}
    image: ${BTCCD_IMAGE:-btcc-core:local}
    restart: unless-stopped
    command:
      - -server=1
      - -txindex=1
      - -datadir=/data
      - -rpcbind=0.0.0.0
      - -rpcallowip=0.0.0.0/0
      - -rpcport=${BTCCD_RPC_PORT:-28476}
      - -rpcuser=${BTCC20_RPC_USER:-btcc_rpc_user}
      - -rpcpassword=${BTCC20_RPC_PASSWORD:-change_me}
    volumes:
      - btccd-data:/data
    ports:
      - "${BTCCD_P2P_PORT:-18465}:18465"
      - "${BTCCD_RPC_PUBLISH_PORT:-127.0.0.1:28476}:28476"

  btcc20-indexer:
    build:
      context: .
    image: btcc20-indexer:latest
    restart: unless-stopped
    depends_on:
      - btccd
    environment:
      BTCC20_CHAIN: ${BTCC20_CHAIN:-mainnet}
      BTCC20_VIEWER_HOST: 0.0.0.0
      BTCC20_VIEWER_PORT: 8798
      BTCC20_RPC_URL: ${BTCC20_RPC_URL:-http://btccd:28476}
      BTCC20_RPC_USER: ${BTCC20_RPC_USER:-btcc_rpc_user}
      BTCC20_RPC_PASSWORD: ${BTCC20_RPC_PASSWORD:-change_me}
      BTCC20_INDEX_FILE: /data/index-state.json
      BTCC20_INDEX_INTERVAL_MS: ${BTCC20_INDEX_INTERVAL_MS:-60000}
      BTCC20_REORG_CHECK_DEPTH: ${BTCC20_REORG_CHECK_DEPTH:-20}
    ports:
      - "${BTCC20_VIEWER_PORT:-8798}:8798"
    volumes:
      - btcc20-indexer-data:/data

volumes:
  btccd-data:
  btcc20-indexer-data:
